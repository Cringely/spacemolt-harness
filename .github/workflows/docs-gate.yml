# Docs gate (#308): the doc-size gate lives in `bun test` (test/doc-size.test.ts),
# in its own workflow because security.yml's charter is security regressions,
# not doc hygiene, and container.yml's charter is code, not docs.
#
# Doc-size only, deliberately: prose-lint is NOT runnable here with zero new
# dependencies — it needs the vale binary plus the operator's machine-global
# styles kit, neither of which exists on a GitHub runner (see guardrails hook 4,
# which degrades to a skip for the same reason). It stays a local hook +
# doc-steward step 8.
#
# No `paths` filter on the triggers (#601): this workflow and container.yml
# both used to path-filter, which meant a PR outside a filtered workflow's
# paths never got the job to run, so its required check (`doc-size`, `test`,
# `verify`) never reported and the merge gate waited forever
# (`mergeStateStatus: BLOCKED` with every visible check green). Dropping the
# filters means a code-only PR now also runs `doc-size` and a docs-only PR now
# also runs `test`/`verify`/`publish` — accepted, since Actions minutes are
# free on this public repo.
#
# Same trigger-security posture as the other workflows: `pull_request` (never
# `pull_request_target`), least-privilege token, actions pinned to commit SHAs.
name: docs-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-size:
    runs-on: ubuntu-latest
    container:
      # Same digest-pinned image as container.yml's test job.
      image: oven/bun:1.3.14-slim@sha256:d56a2534ffd262e92c12fd3249d3924d296d97086da773f821d7d0477435ea04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The gate imports only bun:test + node builtins — verified to pass in a
      # fresh clone with no node_modules, so no `bun install` step.
      - run: bun test test/doc-size.test.ts
